# =============================================================
# nginx.conf  (单应用：blog-portal 前台站点)
# =============================================================
# 用途：直接复制/参考到 /etc/nginx/nginx.conf 或 /etc/nginx/conf.d/portal.conf
# 你需要做的：
#   1. 修改 server_name 为你的域名（多个域名可空格分隔）
#   2. 修改 root 为部署 dist 的实际目录（例如 /var/www/blog-portal）
#   3. 若暂未申请 HTTPS，可先用“HTTP ONLY”版本；申请证书后启用 HTTPS 部分并注释掉纯 HTTP
#   4. 后端地址已指向 http://150.158.48.185:8989，可按需换成内网地址
#   5. 前端使用 HTML5 History 路由 => 必须 try_files 回退 index.html
# =============================================================

# 可选：设定全局（放到主 nginx.conf 的 http{} 中更常见）
# client_max_body_size 20m;           # 如需上传大文件可放开
# sendfile on;                        # 高效传输
# tcp_nopush on; tcp_nodelay on;      # 优化
# keepalive_timeout 65;               # keep-alive 超时

# --------------------------
# 后端上游（如果后续有多实例可在此添加更多 server）
# --------------------------
upstream blog_portal_api {
    server 150.158.48.185:8989;  # 后端服务（HTTP）
    # 示例: server 10.0.0.11:8989 weight=1;
    # 示例: server 10.0.0.12:8989 weight=1;
}

# =============================================================
# 方案 A：仅 HTTP（临时/测试环境使用）
# 启用 HTTPS 后建议移除或 301 跳转
# =============================================================
server {
    listen 80;
    server_name example.com;  # TODO: 替换为你的域名，如 www.example.com

    # 部署目录（放置 dist 内所有文件）
    root /usr/share/nginx/html;  # TODO: 修改为实际路径
    index index.html;

    # Gzip 压缩（可在 http{} 开全局，这里局部也行）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端路由回退（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
    client_max_body_size 20m;

# admin (hash) + 独立静态目录
location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
}

    # API 代理：前端请求 /api/... => 转发到后端
    location /api/ {
        proxy_pass http://blog_portal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # 如后端不识别前缀，可取消注释重写：
        # rewrite ^/api/(.*)$ /$1 break;
    }

    # 长缓存（文件名带 hash）
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 不缓存（便于版本更新）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 基础安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-XSS-Protection "1; mode=block";

    # 可选：错误页（前端统一由 SPA 处理，一般可省略）
    # error_page 404 /index.html;
}

